<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TALLOW — VoltX Games</title>
<meta name="description" content="TALLOW — the next game from VoltX Games. In development.">
<meta property="og:title" content="TALLOW — VoltX Games">
<meta property="og:description" content="The next game from VoltX Games. In development — coming soon.">
<meta property="og:image" content="https://voltx.games/assets/voltx-logo.png">
<link rel="icon" href="../assets/voltx-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
/* ===== TALLOW teaser (warm candle-light theme). Replace the texts/art when the game is revealed. ===== */
:root { --bg: #08050a; --bg2: #120a0c; --line: rgba(255, 190, 120, .18); --ember: #ffb35a; }
body { background: var(--bg); }
.top { background: linear-gradient(to bottom, rgba(8, 5, 10, .94), rgba(8, 5, 10, .55)); }
.menu a:hover { color: var(--ember); }
h2 { background: linear-gradient(90deg, #ffcf8a, #fff, #ffcf8a); -webkit-background-clip: text; background-clip: text; }
html[lang="en"] h2 { font-family: "Cinzel", serif; }
.t-hero { position: relative; min-height: 100vh; display: grid; place-items: center; text-align: center; overflow: hidden; padding: 110px 0 70px; }
.t-hero::before { content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(circle at 50% 40%, rgba(255, 170, 70, .42), rgba(255, 110, 30, .12) 22%, transparent 48%),
    radial-gradient(ellipse at 50% 110%, rgba(110, 40, 15, .6), transparent 60%),
    linear-gradient(180deg, #0f0806, #08050a); }
.dust { position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image:
    radial-gradient(1.5px 1.5px at 30px 40px, #ffd9a0, transparent),
    radial-gradient(1px 1px at 140px 120px, #ffcf8a, transparent),
    radial-gradient(2px 2px at 220px 60px, #ffe4b8, transparent),
    radial-gradient(1px 1px at 90px 220px, #ffcf8a, transparent);
  background-size: 260px 260px; animation: rise 22s linear infinite; }
@keyframes rise { from { background-position: 0 0; } to { background-position: -40px -520px; } }
.t-in { position: relative; z-index: 1; display: grid; justify-items: center; gap: 12px; }
.candle { position: relative; width: 46px; height: 150px; margin-bottom: 10px; }
.candle .wax { position: absolute; bottom: 0; left: 0; right: 0; height: 96px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(90deg, #d9c4a0, #fff2d6 45%, #c9b089); box-shadow: inset 0 -10px 18px rgba(0, 0, 0, .25); }
.candle .wick { position: absolute; bottom: 96px; left: 50%; width: 3px; height: 10px; margin-left: -1.5px; background: #2a1a10; border-radius: 2px; }
.candle .fire { position: absolute; bottom: 102px; left: 50%; width: 26px; height: 50px; margin-left: -13px;
  border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(ellipse at 50% 72%, #fffbe8, #ffd36b 38%, #ff8a1f 68%, transparent 71%);
  filter: drop-shadow(0 0 22px rgba(255, 160, 60, .95)) drop-shadow(0 0 60px rgba(255, 120, 30, .6));
  transform-origin: 50% 90%; animation: flick 2.2s ease-in-out infinite; }
@keyframes flick { 0%, 100% { transform: scale(1, 1) rotate(0); } 25% { transform: scale(.95, 1.07) rotate(-2deg); } 55% { transform: scale(1.04, .94) rotate(2deg); } 80% { transform: scale(.98, 1.03) rotate(-1deg); } }
.t-title { font-family: "Cinzel", serif; font-weight: 900; font-size: clamp(3.2rem, 12vw, 6.5rem); letter-spacing: .18em; line-height: 1; margin: 0;
  color: #ffe6bf; text-shadow: 0 0 30px rgba(255, 170, 70, .55), 0 6px 18px #000; direction: ltr; }
.t-status { font-weight: 800; letter-spacing: 3px; color: var(--ember); border: 1px solid var(--line); border-radius: 999px; padding: 4px 18px; background: rgba(255, 179, 90, .08); }
.t-sub { max-width: 620px; color: #e3cfb4; margin: 0; }
.btn.ember { background: linear-gradient(135deg, #ffbf6b, #e8701f); color: #241000; box-shadow: 0 8px 26px rgba(255, 140, 50, .35); }
.btn.ghost { border-color: rgba(255, 190, 120, .45); background: rgba(255, 190, 120, .07); }
.btn.ghost:hover { background: rgba(255, 190, 120, .16); }
.foot a { color: var(--ember); }
@media (prefers-reduced-motion: reduce) { .dust, .candle .fire { animation: none; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-row">
    <a href="../" class="brand" aria-label="VoltX Games"><img src="../assets/voltx-logo.png" alt="VoltX Games"></a>
    <nav class="menu">
      <a href="../" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
      <a href="../#games" data-ar="ألعابنا" data-en="Games">ألعابنا</a>
      <a href="../#community" data-ar="مجتمعنا" data-en="Community">مجتمعنا</a>
      <a href="../#contact" data-ar="تواصل" data-en="Contact">تواصل</a>
    </nav>
    <button class="lang" id="langBtn" type="button" aria-label="Language">EN</button>
  </div>
</header>

<section class="t-hero">
  <div class="dust" aria-hidden="true"></div>
  <div class="wrap t-in">
    <div class="candle" aria-hidden="true"><div class="fire"></div><div class="wick"></div><div class="wax"></div></div>
    <h1 class="t-title">TALLOW</h1>
    <div class="t-status" data-ar="قيد التطوير" data-en="IN DEVELOPMENT">قيد التطوير</div>
    <p class="t-sub" data-ar="لعبتنا الجديدة من VoltX تتشكّل الآن… شمعة صغيرة اليوم، وعالم كامل قريباً."
       data-en="The next game from VoltX is taking shape… a small candle today, a whole world soon.">لعبتنا الجديدة من VoltX تتشكّل الآن… شمعة صغيرة اليوم، وعالم كامل قريباً.</p>
    <div class="cta">
      <a class="btn ember" href="https://discord.gg/TdF96qyCpZ" target="_blank" rel="noopener" data-ar="كن أول من يعرف — ديسكورد" data-en="Be the first to know — Discord">كن أول من يعرف — ديسكورد</a>
      <a class="btn ghost" href="../#games" data-ar="ألعابنا الأخرى" data-en="Our other games">ألعابنا الأخرى</a>
    </div>
  </div>
</section>

<footer class="foot">
  <div class="wrap foot-row">
    <span>© 2026 <a href="../">VoltX Games</a></span>
    <a href="../privacy.html" data-ar="سياسة الخصوصية" data-en="Privacy Policy">سياسة الخصوصية</a>
  </div>
</footer>

<script>
(function () {
  var btn = document.getElementById('langBtn');
  function apply(lang) {
    var ar = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = ar ? 'rtl' : 'ltr';
    var els = document.querySelectorAll('[data-ar]');
    for (var i = 0; i < els.length; i++) {
      els[i].textContent = els[i].getAttribute(ar ? 'data-ar' : 'data-en');
    }
    btn.textContent = ar ? 'EN' : 'عربي';
    try { localStorage.setItem('voltx-lang', lang); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem('voltx-lang'); } catch (e) {}
  apply(saved || ((navigator.language || '').toLowerCase().indexOf('ar') === 0 ? 'ar' : 'en'));
  btn.addEventListener('click', function () { apply(document.documentElement.lang === 'ar' ? 'en' : 'ar'); });
})();
</script>
</body>
</html>
